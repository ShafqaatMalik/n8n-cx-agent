# Static site, no build step. dashboard/ is served at the site root:
#   /                          -> dashboard/index.html (storefront + VoltBot)
#   /voltshop_dashboard.html   -> dashboard/voltshop_dashboard.html (analytics)
# base = dashboard so Netlify never sees the repo-root requirements.txt and
# skips Python dependency installation; publish is relative to base.
[build]
  base = "dashboard"
  publish = "."
  command = ""
