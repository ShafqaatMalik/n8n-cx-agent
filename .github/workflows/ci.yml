name: CI — Validate Workflows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate, lint and guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install CI tools
        run: pip install flake8 pyyaml

      - name: Validate workflow JSON files
        run: |
          failed=0
          for file in workflows/*.json; do
            if python -c "import json, sys; json.load(open(sys.argv[1]))" "$file"; then
              echo "✓ $file"
            else
              echo "✗ $file — invalid JSON"
              failed=1
            fi
          done
          exit $failed

      - name: Check required files exist
        run: |
          required=(
            "workflows/WF2_Triage.json"
            "workflows/WF3_Action_Layer.json"
            "workflows/WF4_RAG_Resolution.json"
            "workflows/WF5_Feedback_Loop.json"
            "workflows/WF6_Gmail_Intake.json"
            "workflows/WF7_Supabase_Logger.json"
            "infra/cloudrun/service.yaml"
            "netlify.toml"
            ".flake8"
            ".github/workflows/keepalive.yml"
            "scripts/ci_guard.py"
            "docs/voltshop_architecture.md"
            "README.md"
          )
          failed=0
          for file in "${required[@]}"; do
            if [ -f "$file" ]; then echo "✓ $file"; else echo "✗ $file missing"; failed=1; fi
          done
          exit $failed

      - name: Lint scripts (flake8)
        run: flake8 scripts/

      - name: Guard — no secrets, no Railway/ngrok, real credential ids, safe Cloud Run config
        run: python scripts/ci_guard.py
