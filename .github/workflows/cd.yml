name: CD — Deploy to Cloud Run

# Push to main: redeploys the Cloud Run service only when infra/cloudrun/ changed,
# then updates only the workflow JSONs that changed. Workflows keep their live
# credentials, activation state and Gmail poller state (scripts/deploy_workflows.py).
# GitHub → GCP auth is Workload Identity Federation: no service-account key exists.

on:
  push:
    branches: [main]
    paths:
      - "workflows/**"
      - "infra/cloudrun/**"
  workflow_dispatch:
    inputs:
      workflows:
        description: "Workflows to check and update (unchanged ones are skipped)"
        type: choice
        options: [all, none]
        default: all
      redeploy_service:
        description: "Redeploy the Cloud Run service from infra/cloudrun/service.yaml"
        type: boolean
        default: false
      dry_run:
        description: "Workflows: show differences only, write nothing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # Workload Identity Federation

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  GCP_PROJECT: gen-lang-client-0762039552
  GCP_REGION: asia-northeast1
  SERVICE: n8n

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.detect.outputs.service }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_SERVICE: ${{ inputs.redeploy_service }}
          IN_WORKFLOWS: ${{ inputs.workflows }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "service=$IN_SERVICE" >> "$GITHUB_OUTPUT"
            [ "$IN_WORKFLOWS" = "all" ] && echo "workflows=--all" >> "$GITHUB_OUTPUT" || echo "workflows=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            changed=$(git ls-files)  # unknown base: treat everything as changed
          fi
          echo "$changed" | grep -q '^infra/cloudrun/' && echo "service=true" >> "$GITHUB_OUTPUT" || echo "service=false" >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -q '^workflows/' && echo "workflows=--since $BEFORE" >> "$GITHUB_OUTPUT" || echo "workflows=" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

  service:
    name: Redeploy Cloud Run service
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: gcloud run services replace
        run: |
          gcloud run services replace infra/cloudrun/service.yaml \
            --project="$GCP_PROJECT" --region="$GCP_REGION"
      - name: Wait for /health
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
        run: |
          for i in $(seq 1 24); do
            if curl -sf -o /dev/null "$N8N_BASE_URL/health"; then echo "n8n healthy"; exit 0; fi
            echo "waiting ($i)"; sleep 10
          done
          echo "n8n did not become healthy"; exit 1

  workflows:
    name: Update changed workflows
    needs: [changes, service]
    if: >-
      always() && needs.changes.result == 'success' && needs.changes.outputs.workflows != '' &&
      (needs.service.result == 'success' || needs.service.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Deploy workflows
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          TARGET: ${{ needs.changes.outputs.workflows }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python scripts/deploy_workflows.py $TARGET $DRY_RUN
